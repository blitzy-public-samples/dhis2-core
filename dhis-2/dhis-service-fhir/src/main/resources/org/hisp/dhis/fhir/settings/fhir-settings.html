<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FHIR resource mappings</title>
    <style>
      :root { --fhir-text: #212934; --fhir-border: #6c7a89; --fhir-surface: #f3f5f7; --fhir-accent: #0d5ea6; --fhir-error: #b3261e; --fhir-gap: 0.5rem; }
      *, *::before, *::after { box-sizing: border-box; } main { max-width: 80rem; margin: 0 auto; } h1 { font-size: 1.5rem; } h2 { font-size: 1.25rem; margin-block: 2rem 0.75rem; } h3 { font-size: 1rem; margin-block: 1.25rem 0.5rem; }

      .notice:not(:empty) { padding: var(--fhir-gap); margin-block-end: 1rem; border: 1px solid var(--fhir-border); background: var(--fhir-surface); overflow-wrap: break-word; }
      .table-wrap { overflow-x: auto; } table { border-collapse: separate; border-spacing: 0; width: 100%; } caption { text-align: start; font-weight: 600; padding-block-end: var(--fhir-gap); }
      th, td { border: 0 solid var(--fhir-border); border-inline-start-width: 1px; border-block-end-width: 1px; padding: 0.25rem 0.375rem; text-align: start; vertical-align: baseline; overflow-wrap: break-word; } thead th { border-block-start-width: 1px; } th:last-child, td:last-child { border-inline-end-width: 1px; }
      tbody th, #fhir-editing { overflow-wrap: anywhere; } tbody th { min-width: 8rem; } thead th:last-child, tbody td:last-child:not([colspan]) { position: sticky; inset-inline-end: 0; background: Canvas; }
      .editor { display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: flex-start; } .editor > form { flex: 3 1 26rem; min-width: 0; }
      .editor > .notice { flex: 2 1 14rem; min-width: 0; position: sticky; inset-block-start: 1rem; } .editor > .notice:focus { outline: 3px solid var(--fhir-accent); outline-offset: 2px; }
      .field { display: flex; flex-direction: column; gap: 0.25rem; margin-block-end: 0.75rem; } fieldset { border: 1px solid var(--fhir-border); margin: 0 0 0.75rem; min-width: 0; } fieldset.plain { border: 0; padding: 0; margin: 0; }
      .pair, .actions { display: flex; flex-wrap: wrap; gap: var(--fhir-gap) 1rem; align-items: flex-end; } .mapping-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 12rem), 1fr)); gap: var(--fhir-gap) 1rem; align-items: end; }
      .mapping-row > .field, .pair > .field { min-width: 0; margin: 0; } .pair > .field { flex: 1 1 12rem; } .field > :is(input, select) { width: 100%; } .mapping-row > :is(.value-map, button) { grid-column: 1 / -1; margin: 0; } .mapping-row > button { justify-self: start; }
      .pairs { display: flex; flex-direction: column; gap: var(--fhir-gap); margin-block-end: var(--fhir-gap); }
      :root { --fhir-control: #ffffff; --fhir-hover: #bcd3ea; --fhir-pressed: #9fbfe0; --fhir-control-pressed: #e3edf7; --fhir-accent-hover: #083b69; --fhir-accent-pressed: #052744; --fhir-touch: 2.75rem; }
      input, select, button { font: inherit; min-height: var(--fhir-touch); max-width: 100%; padding: 0.25rem var(--fhir-gap); border: 1px solid var(--fhir-border); color: var(--fhir-text); background-color: var(--fhir-control); }
      button { min-width: var(--fhir-touch); cursor: pointer; } button[type="submit"] { background-color: var(--fhir-accent); border-color: var(--fhir-accent); color: #ffffff; }
      :is(input, select, button):hover:not(:disabled):not([aria-invalid="true"]) { border-color: var(--fhir-accent); box-shadow: inset 0 0 0 1px var(--fhir-accent); } button:hover:not(:disabled) { background-color: var(--fhir-hover); } button:active:not(:disabled) { background-color: var(--fhir-pressed); }
      :is(input, select):active:not(:disabled) { background-color: var(--fhir-control-pressed); } button[type="submit"]:hover:not(:disabled) { background-color: var(--fhir-accent-hover); border-color: var(--fhir-accent-hover); box-shadow: none; } button[type="submit"]:active:not(:disabled) { background-color: var(--fhir-accent-pressed); }

      :focus-visible { outline: 3px solid var(--fhir-accent); outline-offset: 2px; } button[type="submit"]:focus-visible { outline-color: var(--fhir-text); } [hidden] { display: none; }
      .table-wrap:hover:not(:focus-visible) { outline: 1px solid var(--fhir-accent); outline-offset: 2px; } .table-wrap:active:not(:focus-visible) { outline: 2px solid var(--fhir-accent); outline-offset: 2px; }
      #fhir-messages:not(:empty) { position: fixed; inset-inline: 1rem; inset-block-end: 1rem; z-index: 2; max-width: 50rem; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: var(--fhir-gap) 1rem; box-shadow: 0 0.25rem 1rem rgb(0 0 0 / 0.25); }
      #fhir-messages > p { margin: 0; flex: 1 1 12rem; } html { scroll-padding-block-end: calc(var(--fhir-message-space, 0px) + var(--fhir-gap)); } body { padding-block-end: calc(1.5rem + var(--fhir-message-space, 0px)); } .skip-link { position: absolute; inset-block-start: 0.25rem; inset-inline-start: 0.25rem; z-index: 3; padding: var(--fhir-gap); background: var(--fhir-surface); color: var(--fhir-text); border: 1px solid var(--fhir-border); }
      .skip-link:not(:focus) { width: 1px; height: 1px; padding: 0; border: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; } .table-wrap { block-size: min(24rem, 60vh); overflow-y: auto; } thead th { position: sticky; inset-block-start: -1px; z-index: 1; background: #ffffff; } #fhir-live { min-block-size: 1.5em; }
      table:has(> tbody > tr > th) thead th::after { content: ""; position: absolute; inset-inline: 0; inset-block-end: -1px; block-size: 1px; background: var(--fhir-border); } button[aria-disabled="true"], button[aria-disabled="true"]:is(:hover, :active) { opacity: 0.6; cursor: not-allowed; filter: none; border-color: var(--fhir-border); }
    </style>
  </head>
  <body>
    <main>
      <a class="skip-link" href="#fhir-editor-heading">Skip to editor</a>
      <h1>FHIR resource mappings</h1>
      <p id="fhir-status" class="notice" aria-live="polite">Checking FHIR API status</p>
      <div id="fhir-messages" class="notice" aria-live="polite"></div>
      <p id="fhir-live" role="status">Loading…</p>
      <section aria-labelledby="fhir-mappings-heading">
        <h2 id="fhir-mappings-heading">Mappings</h2>
        <div class="table-wrap" role="region" aria-labelledby="fhir-mappings-caption" tabindex="0">
          <table aria-busy="true">
            <caption id="fhir-mappings-caption">Stored FHIR resource mappings</caption>
            <thead><tr><th scope="col">Name</th><th scope="col">Resource type</th><th scope="col">Tracked entity type</th><th scope="col">Program</th><th scope="col">Program stage</th><th scope="col">Field mappings</th><th scope="col">Actions</th></tr></thead>
            <tbody id="fhir-mapping-rows"><tr><td colspan="7">Loading mappings…</td></tr></tbody>
          </table>
        </div>
      </section>
      <section aria-labelledby="fhir-editor-heading">
        <h2 id="fhir-editor-heading">Editor</h2>
        <p id="fhir-editing">New mapping</p>
        <div class="editor">
          <form id="fhir-mapping-form" autocomplete="off" aria-busy="true">
            <fieldset id="fhir-form-body" class="plain" aria-labelledby="fhir-editing" aria-busy="false" disabled>
              <div class="field"><label for="fhir-name">Name (required)</label><input type="text" id="fhir-name" required aria-invalid="false"></div>
              <div class="field"><label for="fhir-resource-type">Resource type</label><select id="fhir-resource-type"><option selected>PATIENT</option><option>ENCOUNTER</option><option>IMMUNIZATION</option><option>OBSERVATION</option></select></div>
              <div class="field"><label for="fhir-tracked-entity-type">Tracked entity type (required)</label><select id="fhir-tracked-entity-type" required disabled aria-invalid="false"><option value="">Loading tracked entity types…</option></select></div>
              <div class="field"><label for="fhir-program">Program<span id="fhir-program-required"></span></label><select id="fhir-program" aria-invalid="false"><option value="">(none)</option></select></div>
              <div class="field" id="fhir-program-stage-field" hidden><label for="fhir-program-stage">Program stage (required)</label><select id="fhir-program-stage" aria-invalid="false"><option value="">Select a program first</option></select></div>
              <h3>Field mappings</h3>
              <div id="fhir-field-mappings"></div>
              <div class="actions">
                <button type="button" id="fhir-add-row">Add field mapping</button>
                <button type="submit" disabled>Save</button>
                <button type="button" id="fhir-cancel-edit" hidden>Cancel edit</button>
                <button type="button" id="fhir-clear-form">Clear form</button>
              </div>
            </fieldset>
          </form>
          <div id="fhir-form-errors" class="notice" aria-live="polite" tabindex="-1"></div>
        </div>
      </section>
    </main>
    <script type="module">
      const API = location.pathname.replace(/fhirResourceMappings\/settings\/?$/, '');
      const CHUNK_SIZE = 200, READ_TIMEOUT_MS = 60000, SAVE_COOLDOWN_MS = 500;
      const TEXTUAL = ['TEXT', 'LONG_TEXT', 'LETTER'], INTEGERS = ['INTEGER', 'INTEGER_POSITIVE', 'INTEGER_NEGATIVE', 'INTEGER_ZERO_OR_POSITIVE'];
      const QUANTITY = ['NUMBER', ...INTEGERS, 'PERCENTAGE', 'UNIT_INTERVAL'], CODING = ['system', 'code', 'display'];
      const TARGETS = {
        PATIENT_IDENTIFIER: {resource: 'PATIENT', sources: ['ATTRIBUTE'], required: false, inputs: {ATTRIBUTE: ['system']}, requiredInputs: ['system'],
          valueTypes: [...TEXTUAL, 'USERNAME', 'EMAIL', 'PHONE_NUMBER', 'URL', ...INTEGERS]},
        PATIENT_FAMILY_NAME: {resource: 'PATIENT', sources: ['ATTRIBUTE'], required: false, inputs: {}, requiredInputs: [], valueTypes: TEXTUAL},
        PATIENT_GIVEN_NAME: {resource: 'PATIENT', sources: ['ATTRIBUTE'], required: false, inputs: {}, requiredInputs: [], valueTypes: TEXTUAL},
        PATIENT_GENDER: {resource: 'PATIENT', sources: ['ATTRIBUTE'], required: false, inputs: {ATTRIBUTE: ['valueMap']}, requiredInputs: [], valueTypes: TEXTUAL},
        PATIENT_BIRTH_DATE: {resource: 'PATIENT', sources: ['ATTRIBUTE'], required: false, inputs: {}, requiredInputs: [], valueTypes: ['DATE', 'AGE']},
        PATIENT_PHONE: {resource: 'PATIENT', sources: ['ATTRIBUTE'], required: false, inputs: {}, requiredInputs: [], valueTypes: ['PHONE_NUMBER', 'TEXT']},
        PATIENT_EMAIL: {resource: 'PATIENT', sources: ['ATTRIBUTE'], required: false, inputs: {}, requiredInputs: [], valueTypes: ['EMAIL', 'TEXT']},
        PATIENT_ADDRESS_TEXT: {resource: 'PATIENT', sources: ['ATTRIBUTE'], required: false, inputs: {}, requiredInputs: [], valueTypes: TEXTUAL},
        ENCOUNTER_CLASS: {resource: 'ENCOUNTER', sources: ['CONSTANT'], required: true, inputs: {CONSTANT: CODING}, requiredInputs: ['code'], valueTypes: []},
        ENCOUNTER_TYPE: {resource: 'ENCOUNTER', sources: ['DATA_ELEMENT', 'CONSTANT'], required: false,
          inputs: {DATA_ELEMENT: ['system'], CONSTANT: CODING}, requiredInputs: ['code'], valueTypes: TEXTUAL},
        ENCOUNTER_REASON: {resource: 'ENCOUNTER', sources: ['DATA_ELEMENT'], required: false, inputs: {}, requiredInputs: [], valueTypes: TEXTUAL},
        IMMUNIZATION_ADMINISTERED: {resource: 'IMMUNIZATION', sources: ['DATA_ELEMENT'], required: true, inputs: {}, requiredInputs: [], valueTypes: ['BOOLEAN', 'TRUE_ONLY', 'TEXT']},
        IMMUNIZATION_VACCINE_CODE: {resource: 'IMMUNIZATION', sources: ['CONSTANT'], required: true, inputs: {CONSTANT: CODING}, requiredInputs: ['code'], valueTypes: []},
        IMMUNIZATION_LOT_NUMBER: {resource: 'IMMUNIZATION', sources: ['DATA_ELEMENT'], required: false, inputs: {}, requiredInputs: [], valueTypes: TEXTUAL},
        IMMUNIZATION_DOSE_NUMBER: {resource: 'IMMUNIZATION', sources: ['DATA_ELEMENT'], required: false, inputs: {}, requiredInputs: [], valueTypes: [...INTEGERS, 'TEXT']},
        OBSERVATION_VALUE: {resource: 'OBSERVATION', sources: ['DATA_ELEMENT'], required: true, inputs: {DATA_ELEMENT: ['system', 'code', 'display', 'unit']},
          requiredInputs: ['code'], valueTypes: ['TEXT', 'LONG_TEXT', 'MULTI_TEXT', 'LETTER', 'PHONE_NUMBER', 'EMAIL', 'BOOLEAN', 'TRUE_ONLY', 'DATE',
            'DATETIME', 'TIME', 'NUMBER', 'UNIT_INTERVAL', 'PERCENTAGE', ...INTEGERS, 'USERNAME', 'AGE', 'URL']}
      };
      const TEXT_INPUTS = {system: 'System', code: 'Code', display: 'Display', unit: 'Unit'}, WITH_SOURCE = ['ATTRIBUTE', 'DATA_ELEMENT'], GENDERS = ['male', 'female', 'other', 'unknown'];
      const byId = (id) => document.getElementById(id);
      const form = byId('fhir-mapping-form'), formBody = byId('fhir-form-body'), nameInput = byId('fhir-name'), resourceSelect = byId('fhir-resource-type');
      const typeSelect = byId('fhir-tracked-entity-type'), programSelect = byId('fhir-program'), stageField = byId('fhir-program-stage-field'), stageSelect = byId('fhir-program-stage');
      const rowsBox = byId('fhir-field-mappings'), cancelButton = byId('fhir-cancel-edit'), saveButton = form.querySelector('button[type="submit"]'), messages = byId('fhir-messages');
      const formErrors = byId('fhir-form-errors'), tableBody = byId('fhir-mapping-rows'), live = byId('fhir-live'), clearButton = byId('fhir-clear-form');
      const state = {editing: null, saving: false, editPending: false, resourceType: resourceSelect.value, types: new Map(), programs: [], programsFor: '', programsPending: false, typesLoading: true, programLoad: 0, editLoad: 0, listLoad: 0, rows: [], rowCount: 0, pairCount: 0};
      const runtime = {typesReady: Promise.resolve(), programCache: new Map(), saveReadyAt: 0};
      const mappingTable = tableBody.closest('table'), saveLabel = saveButton.textContent;
      const text = (value) => (value === null || value === undefined ? '' : String(value));
      const isObject = (value) => value !== null && typeof value === 'object' && !Array.isArray(value);
      const list = (value) => (Array.isArray(value) ? value.filter(isObject) : []);
      const count = (size, one, many) => size + ' ' + (size === 1 ? one : many);
      const announce = (message, append) => { live.textContent = append && live.textContent ? live.textContent + ' ' + message : message; };
      const clearedNotice = (cleared, reason) => (cleared.length === 0 ? '' : 'Cleared ' + cleared.map((label) => '"' + label + '"').join(', ') + ': the previous ' + (cleared.length === 1 ? 'choice is' : 'choices are') + ' not available for the selected ' + reason + '.');
      const announceCleared = (cleared, reason, append) => { if (cleared.length > 0 || !append) announce(clearedNotice(cleared, reason), append); };
      function el(tag, attributes, content) {
        const node = document.createElement(tag);
        Object.entries(attributes || {}).forEach(([name, value]) => node.setAttribute(name, value));
        if (content !== undefined) node.textContent = content;
        return node;
      }
      function field(id, labelText, control) {
        const wrapper = el('div', {class: 'field'}), label = wrapper.appendChild(el('label', {for: id}, labelText));
        wrapper.appendChild(control);
        return {wrapper, label};
      }
      function fillSelect(select, placeholder, items) {
        const options = document.createDocumentFragment();
        if (placeholder !== null) options.appendChild(el('option', {value: ''}, placeholder));
        items.forEach(([value, label]) => options.appendChild(el('option', {value}, label)));
        select.replaceChildren(options);
        unflag(select);
      }
      function labelOf(control) {
        const row = control.closest('.mapping-row');
        return (row ? row.firstChild.textContent + ', ' : '') + text(control.labels[0] && control.labels[0].textContent).replace(' (required)', '');
      }
      function setValue(select, value, warnings) {
        const wanted = text(value), known = Array.from(select.options).some((option) => option.value === wanted);
        const kept = !known && wanted && warnings && !select.closest('[hidden]');
        if (kept) select.appendChild(el('option', {value: wanted}, 'Unavailable: ' + wanted));
        select.value = known || kept ? wanted : '';
        if (kept) warnings.push(labelOf(select) + ': "' + wanted + '"');
        return Boolean(wanted) && select.value !== wanted;
      }
      const dropped = (select, lost) => (lost && !select.closest('[hidden]') ? [labelOf(select)] : []);
      function csrfToken() {
        const cookie = document.cookie.split('; ').find((part) => part.startsWith('XSRF-TOKEN='));
        return cookie ? decodeURIComponent(cookie.slice('XSRF-TOKEN='.length)) : '';
      }
      const parseJson = (raw) => { try { return raw ? JSON.parse(raw) : null; } catch (error) { return null; } };
      async function api(method, path, body) {
        const headers = {Accept: 'application/json', 'X-Requested-With': 'XMLHttpRequest', ...(body === undefined ? {} : {'Content-Type': 'application/json'})};
        const token = method === 'GET' ? '' : csrfToken();
        if (token) headers['X-XSRF-TOKEN'] = token;
        const init = {method, credentials: 'same-origin', headers, body: body === undefined ? undefined : JSON.stringify(body),
          signal: method === 'GET' ? AbortSignal.timeout(READ_TIMEOUT_MS) : undefined};
        try {
          const response = await fetch(API + path, init);
          const json = (response.headers.get('Content-Type') || '').includes('json') ? parseJson(await response.text()) : null;
          return {status: response.status, ok: response.ok && !response.redirected, json};
        } catch (error) {
          return {status: 0, ok: false, json: null, timedOut: Boolean(error && error.name === 'TimeoutError')};
        }
      }
      const succeeded = (result) => result.ok && isObject(result.json) && result.json.status === 'OK';
      function errorText(result, retry = 'try again') {
        const json = isObject(result.json) ? result.json : {};
        const reports = isObject(json.response) ? json.response.errorReports : undefined;
        if (result.status === 401) return ['Your session has expired or you are not logged in. Log in again in another browser tab, then return to this tab and ' + retry + '. Reloading this page discards unsaved changes in the editor.'];
        if (Array.isArray(reports) && reports.length > 0) return reports.map((report) => text(report && report.message));
        if (json.message) return text(json.message).split('\n');
        if (result.timedOut) return ['The server did not respond within ' + READ_TIMEOUT_MS / 1000 + ' seconds. Try again.'];
        if (result.status === 0) return ['The server could not be reached. Check the connection and try again.'];

      }
      function showMessage(message) {
        const at = new Date(), note = el('p'), dismiss = el('button', {type: 'button'}, 'Dismiss');
        note.append(el('time', {datetime: at.toISOString()}, at.toLocaleTimeString()), ' ' + message);
        dismiss.addEventListener('click', ({detail}) => { clearMessage(); if (!detail) focusNear(tableBody.closest('.table-wrap'), byId('fhir-mappings-heading')); });
        messages.replaceChildren(note, dismiss);
      }
      const clearMessage = () => messages.replaceChildren();
      const focusNear = (control, area = control) => { control.focus({preventScroll: true}); area.scrollIntoView({block: 'nearest', inline: 'nearest'}); };
      function restoreFocus() {
        const {control, row, top, left} = state.origin || {}, wrap = tableBody.closest('.table-wrap');
        const kept = control && control.isConnected && !control.matches(':disabled');
        const index = kept || row === undefined ? -1 : Math.min(row, tableBody.rows.length - 1), near = tableBody.rows[index];
        const target = kept ? control : row === undefined ? saveButton : (near && near.querySelector('button')) || wrap;
        if (row !== undefined) wrap.scrollLeft = left;
        const anchor = (near || target.closest('tr') || target).getBoundingClientRect();
        if (top !== undefined) scrollBy(0, anchor.top - (near && index < row ? top - anchor.height : top));
        focusNear(target);
      }
      const showError = (result, action) => showMessage('Error: ' + (action ? action + ' failed: ' : '') + errorText(result).join('; '));
      const failed = async (result, action) => { showError(result, action); if (result.status === 404) await loadMappings(); if (document.activeElement === document.body) restoreFocus(); };
      function showFormErrors(problems, heading = 'Error:') {
        formErrors.replaceChildren(el('p', {}, heading), el('ul'));
        problems.forEach((message) => formErrors.lastChild.appendChild(el('li', {}, message)));
      }
      const guard = (handler) => async (...args) => {
        try { await handler(...args); } catch (error) { showMessage('Error: ' + text(error && error.message ? error.message : error)); }
      };
      function collection(result, key) {
        const json = result.ok && isObject(result.json) ? result.json : null;
        if (json && Array.isArray(json[key])) return list(json[key]);
        if (json) showMessage('Error: Malformed response: "' + key + '" is not a list.');
        else showError(result);
        return null;
      }
      async function loadStatus() {
        const result = await api('GET', 'fhir/metadata');
        const enabled = result.status === 200 && isObject(result.json) && result.json.resourceType === 'CapabilityStatement';
        byId('fhir-status').textContent = enabled ? 'FHIR API enabled'
          : result.status === 404 ? 'FHIR API disabled (fhir.api.enabled)' : 'FHIR API status unknown (HTTP ' + result.status + ')';
        if (!enabled && result.status !== 404) showError(result);
      }
      async function loadTrackedEntityTypes() {
        try {
          const result = await api('GET', 'trackedEntityTypes?fields=id,displayName,trackedEntityTypeAttributes[trackedEntityAttribute[id,displayName,valueType]]&paging=false');
          const types = collection(result, 'trackedEntityTypes');
          state.types = new Map((types || []).map((type) => [text(type.id), type]));
          const placeholder = !types ? 'Tracked entity types could not be loaded' : types.length ? 'Select a tracked entity type' : 'No tracked entity types available';
          fillSelect(typeSelect, placeholder, (types || []).map((type) => [text(type.id), text(type.displayName)]));
        } finally {
          typeSelect.disabled = saveButton.disabled = state.typesLoading = false;
          formBody.disabled = state.saving;
          form.removeAttribute('aria-busy');
        }
      }
      function setProgramsPending(pending) {
        state.programsPending = programSelect.disabled = stageSelect.disabled = pending;
        if (pending) saveButton.setAttribute('aria-disabled', 'true'); else saveButton.removeAttribute('aria-disabled');
      }
      async function loadPrograms(typeId) {
        const token = ++state.programLoad;
        let programs = typeId ? runtime.programCache.get(typeId) : [];
        Object.assign(state, {programs: [], programsFor: ''});
        if (!programs) {
          fillSelect(programSelect, 'Loading programs…', []);
          fillStages();
          setProgramsPending(true);
          announce('Loading programs…');
          const result = await api('GET', 'programs?filter=programType:eq:WITH_REGISTRATION&filter=trackedEntityType.id:eq:' + encodeURIComponent(typeId) + '&fields=id,displayName,programTrackedEntityAttributes[trackedEntityAttribute[id,displayName,valueType]],programStages[id,displayName,programStageDataElements[dataElement[id,displayName,valueType]]]&paging=false');
          if (token !== state.programLoad) return;
          programs = collection(result, 'programs');
          if (programs) runtime.programCache.set(typeId, programs);
        }
        if (typeId) announce(programs ? count(programs.length, 'program', 'programs') + ' available.' : 'Programs could not be loaded.');
        setProgramsPending(false);
        state.programs = programs || [];
        state.programsFor = typeId;
        const placeholder = !programs ? '(none: programs could not be loaded)' : typeId && !programs.length ? '(none: no program with registration for this type)' : '(none)';
        fillSelect(programSelect, placeholder, state.programs.map((program) => [text(program.id), text(program.displayName)]));
        fillStages();
      }
      const currentProgram = () => state.programs.find((program) => program.id === programSelect.value);
      const currentStage = () => list((currentProgram() || {}).programStages).find((stage) => stage.id === stageSelect.value);
      function fillStages() {
        const program = currentProgram(), selected = stageSelect.value;
        const stages = program ? list(program.programStages) : [];
        fillSelect(stageSelect, !program ? 'Select a program first' : stages.length ? 'Select a program stage' : 'This program has no stages',
          stages.map((stage) => [text(stage.id), text(stage.displayName)]));
        return dropped(stageSelect, setValue(stageSelect, selected));
      }
      function applyResourceType() {

        if (box && box.bottom > toast.top && box.top < height && box.right > toast.left && box.left < toast.right) active.scrollIntoView({block: 'nearest', inline: 'nearest'});
      }).observe(messages);
      cancelButton.addEventListener('click', guard(() => { resetForm('Edit cancelled. The editor is ready for a new mapping.'); nameInput.focus(); }));
      clearButton.addEventListener('click', guard(() => { resetForm('Form cleared. The editor is ready for a new mapping.'); nameInput.focus(); }));
      window.addEventListener('pageshow', guard((event) => { if (event.persisted) resetForm('The editor was reset for a new mapping.'); }));
      form.noValidate = true;
      form.addEventListener('input', guard(({target}) => { unflag(target); if (target.tagName !== 'SELECT') recheck(); }));
      form.addEventListener('change', guard(recheck));
      form.addEventListener('click', guard(({target}) => { if (target.closest('button[type="button"]')) recheck(); }));
      form.addEventListener('submit', guard(save));
      saveButton.addEventListener('click', guard((event) => {
        if (state.programsPending) return save(event);
        if (performance.now() < runtime.saveReadyAt) event.preventDefault();
      }));
      applyResourceType();
      guard(loadStatus)();
      runtime.typesReady = guard(loadTrackedEntityTypes)();
      guard(loadMappings)();
    </script>
  </body>
</html>
